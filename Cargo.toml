[workspace]
members = [
    "crates/core",
    "crates/api",
    "crates/engine",
    "crates/tracker",
    "crates/contracts",
    "crates/analyzer",
    "crates/storage",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/taran-vijay/pipeline-autopsy"

[workspace.dependencies]
pipeline-autopsy-core = { path = "crates/core" }
pipeline-autopsy-storage = { path = "crates/storage" }
pipeline-autopsy-tracker = { path = "crates/tracker" }
pipeline-autopsy-contracts = { path = "crates/contracts" }
pipeline-autopsy-engine = { path = "crates/engine" }
pipeline-autopsy-analyzer = { path = "crates/analyzer" }
pipeline-autopsy-api = { path = "crates/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
axum = "0.8"
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
serde-saphyr = "2"
petgraph = "0.8"
sqlparser = { version = "0.63", features = ["visitor"] }
duckdb = { version = "1.20000.1", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
